[project]
name = "qs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniele Florio", email = "daniele.florio@agilelab.it" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "openai>=3.3.0",
    "pillow>=11.0.0",
    "pydantic>=2.0.0",
    "ruff>=0.16.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: contacts a real model provider and runs only with explicit opt-in",
]

[tool.coverage.run]
branch = true
source = ["qs"]
omit = ["src/qs/main.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[project.scripts]
qs = "qs.main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
