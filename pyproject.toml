[project]
name = "ExMekh-Lib"
version = "0.1.0"
description = "Strongly typed framework for hierarchical LLM agents and tools"
readme = "README.md"
authors = [
    { name = "Daniele Florio", email = "daniele.florio@agilelab.it" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.1",
    "crawl4ai>=0.9.2",
    "ddgs>=9.14.4",
    "huggingface-hub>=0.35.0",
    "lxml>=5.3.0",
    "numpy>=2.4.0",
    "openai>=3.3.0",
    "openvino>=2026.1.0",
    "pillow>=12.3.0",
    "playwright>=1.53.0",
    "psutil>=7.2.2",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "sympy>=1.14.0",
    "tokenizers>=0.22.2,<0.23",
    "torch>=2.13.0",
    "torchvision>=0.24.0",
    "transformers>=5.14.0",
    "tzdata>=2025.2",
    "z3-solver>=4.15.4.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
addopts = ["-n", "auto", "--dist=loadgroup"]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: contacts public web services or a model provider and runs only with explicit opt-in",
    "serial: runs sequentially with live and other serial tests in one worker",
]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportMissingTypeArgument = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.coverage.run]
branch = true
source = ["exmekh_lib"]
omit = ["src/exmekh_lib/main.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"src/exmekh_lib/capabilities/tools/calculate/main.py" = ["PLC0415"]
"src/exmekh_lib/capabilities/tools/interact-web-page/main.py" = ["PLC0415"]
"src/exmekh_lib/capabilities/tools/read-web-page/main.py" = ["PLC0415"]
"src/exmekh_lib/capabilities/tools/search-web/main.py" = ["PLC0415"]
"src/exmekh_lib/core/reasoning_tools/math.py" = ["PLC0415"]
"src/exmekh_lib/core/web_navigation/crawler.py" = ["PLC0415"]
"src/exmekh_lib/core/web_navigation/ranking.py" = ["PLC0415"]

[project.scripts]
exmekh-lib = "exmekh_lib.main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "exmekh_lib"
