[project]
name = "qs"
version = "0.1.0"
description = "Strongly typed framework for hierarchical LLM agents and tools"
readme = "README.md"
authors = [
    { name = "Daniele Florio", email = "daniele.florio@agilelab.it" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.3.0",
    "pillow>=11.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "tokenizers>=0.22.2,<0.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: contacts a real model provider and runs only with explicit opt-in",
]

[tool.coverage.run]
branch = true
source = ["qs"]
omit = ["src/qs/main.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLC0415"]

[project.scripts]
qs = "qs.main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
